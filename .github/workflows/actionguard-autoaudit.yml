name: ActionGuard AutoAudit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ActionGuard and dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
          pip install pytest PyYAML
          pip install ruff bandit pip-audit zizmor || true

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run complete audit
        env:
          PYTHONPATH: .
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          REPORT_TO_EMAIL: ${{ secrets.REPORT_TO_EMAIL }}
        run: python -m actionguard.cli audit . --html reports/actionguard-report.html --json reports/actionguard-report.json --email

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actionguard-audit-report
          path: |
            reports/actionguard-report.html
            reports/actionguard-report.json
          if-no-files-found: ignore
          retention-days: 7
